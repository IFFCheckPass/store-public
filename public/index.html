<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F7FAF8">
  <title>校园小铺</title>
  <meta name="description" content="校园商品销售平台：公益集市线上选购。">
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a class="skip-link" href="#app">跳到主要内容</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#/" aria-label="校园小铺 首页" data-brand-link>
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="brandGradient" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
                <stop stop-color="#17B890"/>
                <stop offset="1" stop-color="#0E8F69"/>
              </linearGradient>
            </defs>
            <rect width="48" height="48" rx="15" fill="url(#brandGradient)"/>
            <path d="M24 36V22" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
            <path d="M24 25.5c-1.2-6.4-5.4-9.5-11.5-9.5 0 6.4 4.4 10.6 11.5 9.5Z" fill="#fff" opacity=".96"/>
            <path d="M24 29c1.2-6.4 5.4-9.5 11.5-9.5 0 6.4-4.4 10.6-11.5 9.5Z" fill="#E3FFF6" opacity=".92"/>
          </svg>
        </span>
        <span class="brand-text">
          <strong data-brand-name>校园小铺</strong>
          <small data-brand-subtitle></small>
        </span>
      </a>

      <nav class="nav" aria-label="主导航">
        <a class="nav-link" data-nav="home" href="#/">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1v-8.5Z"/></svg>
          <span class="nav-label">首页</span>
        </a>
        <a class="nav-link" data-nav="cart" href="#/cart">
          <span class="nav-icon-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.2l2.1 10.4a2 2 0 0 0 2 1.6h7.4a2 2 0 0 0 2-1.6L20 7H6"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17.5" cy="19.5" r="1.3"/></svg>
          </span>
          <span class="nav-label">购物车</span>
          <span class="nav-count" data-cart-count hidden>0</span>
        </a>
        <a class="nav-link" data-nav="orders" href="#/orders">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h10a1 1 0 0 1 1 1V21l-3-1.8L12 21l-3-1.8L6 21V4.5a1 1 0 0 1 1-1Z"/><path d="M9.5 8h5M9.5 11.5h5"/></svg>
          <span class="nav-label">我的订单</span>
        </a>
      </nav>

      <div class="header-user" data-user-area>
        <a class="user-login-btn" href="#/login">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.6-3.4 3.4-5.5 7-5.5s6.4 2.1 7 5.5"/></svg>
          <span>登录</span>
        </a>
      </div>
    </div>
  </header>

  <main id="app" class="app-main">
    <div class="container page-loading">
      <span class="spinner" aria-hidden="true"></span>
      <p>正在准备小铺…</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div class="footer-brand">
        <a class="brand brand--footer" href="#/" data-brand-link>
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="48" height="48" rx="15" fill="#12A67A"/>
              <path d="M24 36V22" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
              <path d="M24 25.5c-1.2-6.4-5.4-9.5-11.5-9.5 0 6.4 4.4 10.6 11.5 9.5Z" fill="#fff" opacity=".96"/>
              <path d="M24 29c1.2-6.4 5.4-9.5 11.5-9.5 0 6.4-4.4 10.6-11.5 9.5Z" fill="#E3FFF6" opacity=".92"/>
            </svg>
          </span>
          <span class="brand-text">
            <strong data-brand-name>校园小铺</strong>
            <small data-brand-tagline></small>
          </span>
        </a>
        <p class="footer-desc" data-footer-description></p>
      </div>
      <div class="footer-col">
        <h4>逛逛小铺</h4>
        <a href="#/">全部商品</a>
        <a href="#/cart">购物车</a>
        <a href="#/orders">我的订单</a>
      </div>
      <div class="footer-col">
        <h4>购物说明</h4>
        <div data-footer-tips>
          <p>· 统一送货到班</p>
          <p>· 支持微信、支付宝扫码</p>
          <p>· 赠货码可直接免支付</p>
        </div>
      </div>
      <div class="footer-col">
        <h4>集市说明</h4>
        <p data-footer-hours></p>
        <p data-footer-notice>如遇问题，请在订单备注中说明，我们会尽快处理。</p>
      </div>
    </div>
    <div class="container footer-bottom">
      <span data-footer-copyright></span>
      <span data-footer-payment-note>演示收款码不可真实支付，支付截图仅用于本地 OCR 识别演示。</span>
    </div>
  </footer>

  <div id="modal-root"></div>
  <div class="toast-stack" id="toast-root" role="status" aria-live="polite"></div>

  <noscript>
    <div class="noscript-tip">请开启浏览器的 JavaScript 后再访问本站。</div>
  </noscript>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
